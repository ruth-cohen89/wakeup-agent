# XcodeGen manifest — this is now the primary way the project is built.
#
# There is no .xcodeproj in the repo and there does not need to be one. CI runs
# `xcodegen generate` on a GitHub macOS runner, so the project never has to be
# created by hand in the Xcode GUI. That was the last step that genuinely
# required a Mac; see docs/ci-build.md.
#
# To build locally (only if you ever do get access to a Mac):
#   cd ios/WakeSpike && xcodegen generate && open WakeSpike.xcodeproj
#
# Signing is deliberately absent here. A free Apple Personal Team cannot be signed
# in CI (docs/signing-feasibility.md); the unsigned .ipa is signed on Windows by
# Sideloadly (docs/install-from-windows.md).

name: WakeSpike

options:
  bundleIdPrefix: com.wakespike
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  WakeSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        # NOT `info: path:` — that key makes XcodeGen *generate* a plist at that
        # path from its own defaults and overwrite the committed one. It did
        # exactly that: the shipped app carried none of our keys, so AlarmKit had
        # no usage description and the app had no launch screen. INFOPLIST_FILE
        # is the setting that means "ship this file"; it resolves against SRCROOT
        # (ios/WakeSpike), and pairs with GENERATE_INFOPLIST_FILE: NO below.
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wakespike.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # CI builds unsigned. Sideloadly applies the real signature afterwards, so
        # nothing here should assume a certificate exists.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

# Declared explicitly rather than relying on auto-generation, so `xcodebuild
# -scheme WakeSpike` is guaranteed to resolve in CI.
schemes:
  WakeSpike:
    build:
      targets:
        WakeSpike: all
    run:
      config: Debug
    archive:
      config: Release
